[package]
name = "troy"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
description = "Superfast primitives and data structures for high frequency trading"
repository = "https://github.com/quantmind/troy"
documentation = "https://docs.rs/troy"
license = "MIT"
readme = "readme.md"
keywords = ["hft", "trading", "orderbook", "decimal", "low-latency"]
categories = ["mathematics", "data-structures"]
publish = true

[lib]
name = "troy"
path = "src/mod.rs"

# docs.rs builds one page per published version; build it with serde and
# rust_decimal on so the optional conversions are documented
[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
rand = { version = "0.10.2", optional = true }
rand_distr = { version = "0.6.0", optional = true }
rust_decimal = { version = "1.43", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
# also optional dependencies of the `testing` feature; repeated here so the
# crate's own tests can use the harness without enabling it
rand = "0.10.2"
rand_distr = "0.6.0"
fastnum = "0.7.5"
# `maths` carries MathematicalOps, which is where rust_decimal keeps its square
# root; the benchmarks need it to have something to compare against. It is a
# dev-dependency feature, so it does not reach the optional conversions.
rust_decimal = { version = "1.43", features = ["maths"] }
serde_json = "1.0"
proptest = "1.11.0"

[features]
default = []
testing = ["dep:rand", "dep:rand_distr"]
rust_decimal = ["dep:rust_decimal"]
serde = ["dep:serde"]

[[bench]]
name = "dec"
harness = false

[[bench]]
name = "orderbook"
harness = false
