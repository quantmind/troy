name: pages

# Publishes the benchmark and docs site from the committed snapshot in
# docs/bench-data.json. The numbers are measured on a known machine and
# committed deliberately — a shared CI runner varies by more than the
# differences being measured, so nothing here runs `cargo bench`.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a queued deploy waits for the running one rather than cancelling it, so the
# published page always reflects the last commit rather than the last start
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm --prefix site ci

      - name: Build the site
        run: npm --prefix site run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
